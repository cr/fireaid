[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fireaid"
version = "0.1.0"
description = "Transparent Google Python Fire wrapper with conventional help syntax"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Christiane Ruetten (cr@23bit.net)"}
]
dependencies = [
    "fire>=0.7"
]

[project.urls]
Homepage = "https://github.com/cr/fireaid"
Repository = "https://github.com/cr/fireaid"

[tool.setuptools.packages.find]
where = ["src"]
