[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fireaid"
version = "0.3.0dev3"
description = "Familiar help for command-line tools made with Python Fire"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Christiane Ruetten", email = "cr@23bit.net"}
]
dependencies = [
    "fire>=0.2.0"
]

[project.optional-dependencies]
test = [
    "pytest",
    "rich"  # for examples/progress.py
]

[project.urls]
Homepage = "https://github.com/cr/fireaid"
Repository = "https://github.com/cr/fireaid"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Fire 0.7.1 calls a function deprecated in Python 3.14 and removed in 3.16.
# Remove this filter once Fire has replaced it.
filterwarnings = [
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:fire",
]
