[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fireaid"
version = "0.3.0dev5"
description = "Familiar help, typed values and remote control for command-line tools made with Python Fire"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Christiane Ruetten", email = "cr@23bit.net"}
]
keywords = ["fire", "cli", "command-line", "help", "remote control", "type hints"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: User Interfaces",
]
dependencies = [
    "fire>=0.2.0",
    # Fire before 0.7.0 imports pipes, which Python 3.13 removed.
    "fire>=0.7.0; python_version >= '3.13'",
]

[project.optional-dependencies]
test = [
    "colorama",  # what Fire strips colour with on Windows, to test against anywhere
    "pytest",
    "rich",  # for examples/progress.py
]

[project.urls]
Homepage = "https://github.com/cr/fireaid"
Repository = "https://github.com/cr/fireaid"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Fire 0.7.1 calls a function deprecated in Python 3.14 and removed in 3.16.
# Remove this filter once Fire has replaced it.
filterwarnings = [
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:fire",
]
