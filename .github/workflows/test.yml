# Runs the tests on every push and pull request: on Linux, macOS and
# Windows, each on the oldest Python fireaid supports and the latest
# stable one. Remote control and terminal tests skip on Windows, where
# fireaid has no remote control.

name: Test

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]  # the publish workflow tests a release itself
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.x"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # What make test does, without make: the tests run against the
      # latest stable Fire.
      - run: python -m pip install --quiet --upgrade pip
      - run: python -m pip install --quiet --editable ".[test]"
      - run: python -m pip install --quiet --upgrade fire
      - run: python -m pytest
