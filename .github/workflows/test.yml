# Runs the tests on every push and pull request: on Linux, macOS and
# Windows, each on the oldest Python fireaid supports and the latest
# stable one, with the latest stable Fire; and on Linux with the oldest
# Python and the oldest Fire. Terminal tests skip on Windows, which has
# no pseudo-terminals. The publish workflow runs the same before a
# release.

name: Test

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]  # the publish workflow tests a release itself
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20  # the suite takes two; a hung test is cut short
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.x"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # What make test does, without make: the tests run against the
      # latest stable Fire.
      - run: python -m pip install --quiet --upgrade pip
      - run: python -m pip install --quiet --editable ".[test]"
      - run: python -m pip install --quiet --upgrade fire
      - run: python -m pytest

  test-min:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - run: make test-min PYTHON_MIN=python
